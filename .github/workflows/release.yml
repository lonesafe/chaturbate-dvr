name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build embedded CSS
        run: npm run build:css

      - name: Check generated CSS
        run: git diff --exit-code -- router/view/templates/styles/app.css

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=build-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: "386"
            goarm: ""
            asset: chaturbate-dvr-linux-x86
          - goos: linux
            goarch: amd64
            goarm: ""
            asset: chaturbate-dvr-linux-x86_64
          - goos: linux
            goarch: arm
            goarm: "7"
            asset: chaturbate-dvr-linux-armv7
          - goos: linux
            goarch: arm64
            goarm: ""
            asset: chaturbate-dvr-linux-arm64
          - goos: darwin
            goarch: amd64
            goarm: ""
            asset: chaturbate-dvr-macos-x86_64
          - goos: darwin
            goarch: arm64
            goarm: ""
            asset: chaturbate-dvr-macos-arm64
          - goos: windows
            goarch: "386"
            goarm: ""
            asset: chaturbate-dvr-windows-x86.exe
          - goos: windows
            goarch: amd64
            goarm: ""
            asset: chaturbate-dvr-windows-x86_64.exe
          - goos: windows
            goarch: arm64
            goarm: ""
            asset: chaturbate-dvr-windows-arm64.exe
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ needs.verify.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${ASSET}" .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum chaturbate-dvr-* > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}-${{ needs.verify.outputs.short_sha }}
          name: "自动构建 #${{ github.run_number }} · ${{ needs.verify.outputs.short_sha }}"
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/chaturbate-dvr-*
            dist/SHA256SUMS.txt
